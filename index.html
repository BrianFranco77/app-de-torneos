const mk=(a,b)=>{const m={id:uid++,a,b};M[m.id]=m;return m};
const loser=m=>m.w===m.a?m.b:m.a;
$('dgo').onclick=()=>{
 const n=names.length,byes=size-n,bm=[],pm=[];
 for(let k=0;k<byes;k++)bm.push(mk(order[k],null));
 for(let j=byes;j<n;j+=2)pm.push(mk(order[j],order[j+1]));
 const m=bm.length+pm.length,r1=Array(m).fill(null);
 bm.forEach((x,b)=>{r1[b%2?m-1-(b>>1):b>>1]=x});let pi=0;for(let i=0;i<m;i++)if(!r1[i])r1[i]=pm[pi++];
 rounds=[r1];third=null;wasDone=false;show('play');advance();render()};
$('reset').onclick=()=>{LS.r('trnS');names=null;wasDone=false;document.body.classList.remove('tv');$('fin').hidden=true;confetti(false);show('home')};
function advance(){let ch=true;
 while(ch){ch=false;
  [...rounds.flat(),...(third?[third]:[])].forEach(m=>{if(m.w===undefined&&(m.a===null||m.b===null)){m.w=m.a===null?m.b:m.a;ch=true}});
  const last=rounds[rounds.length-1];
  if(last.length>1&&last.every(m=>m.w!==undefined)){
   const ws=last.map(m=>m.w),nx=[];for(let i=0;i<ws.length;i+=2)nx.push(mk(ws[i],ws[i+1]));
   if(last.length===2)third=mk(loser(last[0]),loser(last[1]));
   rounds.push(nx);ch=true}}}
const ls=m=>m.w===undefined?undefined:loser(m);
const chk=m=>{if(m.w!==undefined&&(m.a===undefined||m.b===undefined||(m.w!==m.a&&m.w!==m.b)))m.w=undefined};
function resync(){
 for(let r=1;r<rounds.length;r++)rounds[r].forEach((m,i)=>{const p=rounds[r-1];m.a=p[2*i].w;m.b=p[2*i+1].w;chk(m)});
 if(third){const s=rounds[rounds.length-2];third.a=ls(s[0]);third.b=ls(s[1]);chk(third)}}
function pick(id,s){const m=M[id];if(!(m.a&&m.b))return;m.w=s?m.b:m.a;resync();advance();render()}
const rn=r=>r===R-1?t('fin'):r===R-2?t('sf'):r===R-3?t('qf'):t('rd')+' '+(r+1);
function mh(m){
 if(!m)return '<div class="m"><span class="nm ph" style="padding:7px 9px;display:block">'+t('tbd')+'</span><span class="nm ph" style="padding:7px 9px;display:block;border:0">'+t('tbd')+'</span></div>';
 const open=!!(m.a&&m.b),cl=x=>m.w===undefined?'':(m.w===x?'w':'l');
 const tx=x=>x===null?'—':x===undefined?'<i class="ph">'+t('tbd')+'</i>':esc(x);
 const b=(x,s)=>'<button class="nm '+cl(x)+'" '+(open?'onclick="pick('+m.id+','+s+')"':'disabled')+'>'+tx(x)+'</button>';
 return '<div class="m">'+b(m.a,0)+b(m.b,1)+'</div>'}
function colH(r,half){const rd=rounds[r],h=size/Math.pow(2,r+1)/2;let o='';
 for(let i=0;i<h;i++)o+=mh(rd?rd[half*h+i]:null);
 return '<div class="col"><h3>'+rn(r)+'</h3>'+o+'</div>'}
function render(){
 const fin=rounds[R-1]&&rounds[R-1][0];let L='',Rt='';
 for(let r=0;r<R-1;r++){L+=colH(r,0);Rt=colH(r,1)+Rt}
 const win=fin&&fin.w!==undefined,done=win&&(!third||third.w!==undefined);saveState();
 $('bracket').innerHTML=L+'<div class="ctr">'+cup3()+
  (win?'<div class="champ">🎉 '+t('champ')+'<br>'+esc(fin.w)+(prizes[0]?'<br><span style="font-size:.85rem">'+t('takes')+' '+esc(prizes[0])+'</span>':'')+'</div>':'')+
  '<h3 class="mu" style="margin:0;font-size:.75rem">'+t('fin')+'</h3>'+mh(fin)+
  (size>=4?'<h3 class="mu" style="margin:6px 0 0;font-size:.75rem">'+t('th')+'</h3>'+mh(third):'')+'</div>'+Rt;
 $('resCard').hidden=!done;
 if(done){const res=[fin.w,loser(fin)];if(third){res.push(third.w,loser(third))}LASTRES=res;addHist(res);
  $('pod').innerHTML=res.map((p,i)=>p===null?'':'<div class="'+(i?'':'p1')+'"><span>'+PLn(i)+': <b>'+esc(p)+'</b></span><span>'+esc(prizes[i]||'')+'</span></div>').join('');
  $('fn').textContent=fin.w;$('fp').textContent=prizes[0]?t('takes')+' '+prizes[0]:'';
  $('fpod').innerHTML=res.map((p,i)=>(i===0||p===null)?'':'<div><span>'+PLn(i)+': <b>'+esc(p)+'</b></span><span>'+esc(prizes[i]||'')+'</span></div>').join('');
  if(!wasDone){$('fin').hidden=false;confetti(true);sfx('fanfare')}}
 wasDone=!!done}
$('fx').onclick=()=>{$('fin').hidden=true;confetti(false)};
applyLang();show('home');
</script><script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
